<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexusLink 管理面板</title>
<style>
/* ========== RESET & VARIABLES ========== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --sakura-50:#fff5f7;
  --sakura-100:#ffe4e8;
  --sakura-200:#ffccd5;
  --sakura-300:#ffb3bf;
  --sakura-400:#ff8fa3;
  --sakura-500:#ff6b81;
  --sakura-600:#e91e63;
  --sakura-700:#c1174f;
  --bg:#fafafa;
  --surface:#fff;
  --sidebar-bg:linear-gradient(180deg,#1a1a2e 0%,#16213e 100%);
  --sidebar-text:#c0c0d0;
  --sidebar-active:#ff6b81;
  --sidebar-hover:#2a2a4a;
  --text:#2c2c3a;
  --text-secondary:#808090;
  --border:#eee;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.06);
  --shadow-lg:0 8px 24px rgba(0,0,0,.08);
  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:16px;
  --radius-xl:24px;
  --transition:all .25s ease;
}
[data-theme="dark"]{
  --bg:#1a1a2e;
  --surface:#16213e;
  --text:#e8e8f0;
  --text-secondary:#9090a0;
  --border:#2a2a4a;
  --shadow-sm:0 1px 2px rgba(0,0,0,.2);
  --shadow-md:0 4px 12px rgba(0,0,0,.3);
  --shadow-lg:0 8px 24px rgba(0,0,0,.4);
  --sidebar-bg:#0f0f23;
}
body{
  font-family:'PingFang SC','Microsoft YaHei',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  display:flex;
  min-height:100vh;
  transition:var(--transition);
}

/* ========== SIDEBAR ========== */
.sidebar{
  width:240px;
  min-height:100vh;
  background:var(--sidebar-bg);
  color:#fff;
  display:flex;
  flex-direction:column;
  position:fixed;
  left:0;top:0;bottom:0;
  z-index:100;
  transition:transform .3s ease;
}
.sidebar-brand{
  padding:24px 20px;
  border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;
  align-items:center;
  gap:12px;
}
.sidebar-brand .logo-icon{font-size:24px}
.sidebar-brand .logo-text{font-size:20px;font-weight:700;color:#fff}
.sidebar-brand .logo-version{font-size:12px;color:#808090;margin-left:auto}
.sidebar-nav{
  flex:1;padding:12px 0;overflow-y:auto;
}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 20px;margin:2px 8px;
  border-radius:var(--radius-md);
  color:var(--sidebar-text);
  text-decoration:none;
  font-size:14px;font-weight:500;cursor:pointer;
  transition:var(--transition);
  border:none;background:none;width:calc(100% - 16px);
}
.nav-item:hover{background:var(--sidebar-hover);color:#fff}
.nav-item.active{background:var(--sidebar-active);color:#fff;box-shadow:0 4px 12px rgba(255,107,129,.3)}
.nav-item .nav-icon{font-size:18px;width:24px;text-align:center}
.sidebar-footer{
  padding:16px 20px;
  border-top:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;gap:12px;
}
.theme-toggle{
  width:36px;height:36px;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,.15);
  background:transparent;color:var(--sidebar-text);cursor:pointer;font-size:18px;
  display:flex;align-items:center;justify-content:center;
  transition:var(--transition);
}
.theme-toggle:hover{background:var(--sidebar-hover);color:#fff}

/* ========== MAIN CONTENT ========== */
.main-content{
  margin-left:240px;flex:1;
  padding:28px 32px;
  min-height:100vh;
  transition:var(--transition);
}
.page-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:28px;
}
.page-title{font-size:24px;font-weight:700;color:var(--text)}
.page-subtitle{font-size:14px;color:var(--text-secondary);margin-top:4px}

/* ========== STATS CARDS / 樱花瓣服务器信息卡片 ========== */
.stats-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin-bottom:28px;
}
.stat-card{
  background:var(--surface);
  border-radius:var(--radius-lg);
  padding:24px;
  box-shadow:var(--shadow-md);
  transition:var(--transition);
  position:relative;
  overflow:hidden;
  border:1px solid var(--border);
}
.stat-card::before{
  content:'';
  position:absolute;
  top:-20px;right:-20px;
  width:80px;height:80px;
  border-radius:50%;
  opacity:.08;
}
.stat-card:nth-child(1)::before{background:#ff6b81}
.stat-card:nth-child(2)::before{background:#ff8fa3}
.stat-card:nth-child(3)::before{background:#ffb3bf}
.stat-card:nth-child(4)::before{background:#e91e63}
.stat-card:hover{
  transform:translateY(-4px);
  box-shadow:var(--shadow-lg);
}
.stat-card .stat-icon{font-size:28px;margin-bottom:12px}
.stat-card .stat-value{font-size:32px;font-weight:700;color:var(--sakura-600)}
.stat-card .stat-label{font-size:13px;color:var(--text-secondary);margin-top:4px}
.stat-card .stat-change{font-size:12px;margin-top:8px}

/* ========== CONTENT SECTIONS ========== */
.content-section{margin-bottom:28px}
.section-title{font-size:18px;font-weight:600;color:var(--text);margin-bottom:16px}
.card{
  background:var(--surface);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-md);
  border:1px solid var(--border);
  overflow:hidden;
}
.card-header{
  padding:16px 24px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}

/* ========== TABLE ========== */
.data-table{width:100%;border-collapse:collapse}
.data-table th{
  text-align:left;padding:14px 24px;
  font-size:12px;font-weight:600;color:var(--text-secondary);
  text-transform:uppercase;letter-spacing:.5px;
  background:var(--sakura-50);
  border-bottom:1px solid var(--border);
}
.data-table td{
  padding:14px 24px;font-size:14px;
  border-bottom:1px solid var(--border);
  color:var(--text);
}
.data-table tr:hover td{background:var(--sakura-50)}
.badge{
  display:inline-block;padding:4px 12px;border-radius:20px;
  font-size:12px;font-weight:600;
}
.badge-success{background:rgba(76,175,80,.12);color:#2e7d32}
.badge-danger{background:rgba(244,67,54,.12);color:#c62828}
.badge-info{background:rgba(33,150,243,.12);color:#1565c0}
.badge-warning{background:rgba(255,152,0,.12);color:#e65100}

/* ========== LOG LIST ========== */
.log-list{max-height:400px;overflow-y:auto}
.log-item{
  display:flex;align-items:flex-start;gap:12px;
  padding:12px 24px;border-bottom:1px solid var(--border);
  font-size:13px;line-height:1.5;
}
.log-item:last-child{border-bottom:none}
.log-time{color:var(--text-secondary);font-size:12px;white-space:nowrap;min-width:140px}
.log-level{
  font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;
  text-transform:uppercase;min-width:56px;text-align:center;
}
.log-level.info{background:rgba(76,175,80,.12);color:#2e7d32}
.log-level.warn{background:rgba(255,152,0,.12);color:#e65100}
.log-level.error{background:rgba(244,67,54,.12);color:#c62828}

/* ========== BUTTONS ========== */
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 20px;border-radius:var(--radius-sm);
  font-size:14px;font-weight:500;cursor:pointer;
  border:none;transition:var(--transition);
}
.btn-primary{
  background:linear-gradient(135deg,var(--sakura-400),var(--sakura-500));
  color:#fff;box-shadow:0 4px 12px rgba(255,107,129,.3);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(255,107,129,.4)}
.btn-secondary{
  background:var(--surface);color:var(--text);
  border:1px solid var(--border);
}
.btn-secondary:hover{background:var(--sakura-50)}

/* ========== LOGIN PAGE ========== */
.login-page{
  position:fixed;inset:0;z-index:9999;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg);
}
.login-box{
  background:var(--surface);
  padding:48px 32px;border-radius:var(--radius-xl);
  box-shadow:var(--shadow-lg);
  width:100%;max-width:400px;
  text-align:center;
  border:1px solid var(--border);
}
.login-box h1{font-size:28px;color:var(--sakura-600);margin-bottom:8px}
.login-box p{color:var(--text-secondary);font-size:14px;margin-bottom:28px}
.login-box input{
  width:100%;padding:14px 18px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--bg);color:var(--text);
  font-size:15px;margin-bottom:16px;outline:none;
  transition:var(--transition);
}
.login-box input:focus{border-color:var(--sakura-400);box-shadow:0 0 0 3px rgba(255,107,129,.1)}
.login-box .login-btn{
  width:100%;padding:14px;border-radius:var(--radius-sm);
  background:linear-gradient(135deg,var(--sakura-400),var(--sakura-500));
  color:#fff;border:none;font-size:16px;font-weight:600;cursor:pointer;
  transition:var(--transition);
}
.login-box .login-btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(255,107,129,.4)}
.login-error{color:#c62828;font-size:13px;margin-top:12px}

/* ========== MOBILE RESPONSIVE ========== */
.menu-toggle{
  display:none;position:fixed;top:16px;left:16px;
  z-index:200;width:40px;height:40px;border-radius:var(--radius-sm);
  background:var(--surface);border:1px solid var(--border);
  font-size:20px;cursor:pointer;
}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main-content{margin-left:0;padding:20px 16px}
  .menu-toggle{display:flex;align-items:center;justify-content:center}
  .stats-grid{grid-template-columns:1fr 1fr}
}

/* ========== EMPTY STATE ========== */
.empty-state{text-align:center;padding:60px 20px;color:var(--text-secondary)}
.empty-state svg{margin-bottom:16px;opacity:.4}
.empty-state p{font-size:14px}

/* ========== ANIMATION ========== */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fadeIn{animation:fadeIn .4s ease}

/* ========== HIDDEN ========== */
.hidden{display:none!important}

/* Scrollbar */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--sakura-300);border-radius:10px}
</style>
</head>
<body>

<!-- Mobile Menu Toggle -->
<button class="menu-toggle" onclick="toggleSidebar()">☰</button>

<!-- ========== SIDEBAR ========== -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <span class="logo-icon">🌸</span>
    <span class="logo-text">NexusLink</span>
    <span class="logo-version" id="sidebarVersion">v0.3.3</span>
  </div>
  <nav class="sidebar-nav">
    <button class="nav-item active" data-page="dashboard" onclick="switchPage('dashboard',this)">
      <span class="nav-icon">📊</span> 仪表盘
    </button>
    <button class="nav-item" data-page="proxies" onclick="switchPage('proxies',this)">
      <span class="nav-icon">🔗</span> 代理管理
    </button>
    <button class="nav-item" data-page="logs" onclick="switchPage('logs',this)">
      <span class="nav-icon">📋</span> 系统日志
    </button>
    <button class="nav-item" data-page="settings" onclick="switchPage('settings',this)">
      <span class="nav-icon">⚙️</span> 设置
    </button>
  </nav>
  <div class="sidebar-footer">
    <button class="theme-toggle" onclick="toggleTheme()" title="切换主题">🌙</button>
    <span style="font-size:12px;color:var(--sidebar-text);flex:1">主题</span>
    <button class="theme-toggle" onclick="handleLogout()" title="退出登录" style="font-size:14px">⟪</button>
  </div>
</aside>

<!-- ========== MAIN CONTENT ========== -->
<main class="main-content" id="mainContent">

  <!-- ===== DASHBOARD PAGE ===== -->
  <div class="page-content" id="page-dashboard">
    <div class="page-header">
      <div><div class="page-title">仪表盘</div><div class="page-subtitle">服务器运行状态概览</div></div>
    </div>

    <!-- 服务器信息统计卡片 -->
    <div class="stats-grid fadeIn">
      <div class="stat-card">
        <div class="stat-icon">🔌</div>
        <div class="stat-value" id="statClients">0</div>
        <div class="stat-label">在线客户端连接数</div>
        <div class="stat-change" style="color:#4caf50">▲ 实时</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🔗</div>
        <div class="stat-value" id="statProxies">0</div>
        <div class="stat-label">活跃代理数</div>
        <div class="stat-change" style="color:#4caf50">▲ 实时</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">📦</div>
        <div class="stat-value" id="statVersion">v0.3.3</div>
        <div class="stat-label">服务端版本</div>
        <div class="stat-change" style="color:var(--text-secondary)">运行中</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">⏱️</div>
        <div class="stat-value" id="statUptime" style="font-size:22px">--</div>
        <div class="stat-label">运行时长</div>
        <div class="stat-change" id="statStartTime" style="color:var(--text-secondary)">--</div>
      </div>
    </div>

    <!-- 服务器基础信息 -->
    <div class="content-section fadeIn">
      <div class="section-title">📡 服务器信息</div>
      <div class="card">
        <table class="data-table">
          <tbody>
            <tr><td style="width:140px;color:var(--text-secondary);font-weight:600">监听地址</td><td id="infoBindAddr">--</td></tr>
            <tr><td style="color:var(--text-secondary);font-weight:600">监听端口</td><td id="infoBindPort">--</td></tr>
            <tr><td style="color:var(--text-secondary);font-weight:600">客户端数</td><td id="infoClients">0</td></tr>
            <tr><td style="color:var(--text-secondary);font-weight:600">代理数</td><td id="infoProxies">0</td></tr>
            <tr><td style="color:var(--text-secondary);font-weight:600">版本号</td><td id="infoVersion">v0.3.3</td></tr>
            <tr><td style="color:var(--text-secondary);font-weight:600">启动时间</td><td id="infoStartTime">--</td></tr>
            <tr><td style="color:var(--text-secondary);font-weight:600">运行时长</td><td id="infoUptime">--</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 代理列表预览 -->
    <div class="content-section fadeIn">
      <div class="section-title">🔗 代理列表预览</div>
      <div class="card">
        <div class="card-header">
          <span style="font-weight:600">活跃代理</span>
          <span id="proxyCountBadge" style="font-size:13px;color:var(--text-secondary)">0 个</span>
        </div>
        <div id="dashboardProxyList"></div>
      </div>
    </div>
  </div>

  <!-- ===== PROXIES PAGE ===== -->
  <div class="page-content hidden" id="page-proxies">
    <div class="page-header">
      <div><div class="page-title">代理管理</div><div class="page-subtitle">管理所有 TCP/UDP 代理隧道</div></div>
    </div>
    <div class="content-section">
      <div class="card">
        <div id="proxiesTableContainer"></div>
      </div>
    </div>
  </div>

  <!-- ===== LOGS PAGE ===== -->
  <div class="page-content hidden" id="page-logs">
    <div class="page-header">
      <div><div class="page-title">系统日志</div><div class="page-subtitle">服务器操作记录</div></div>
      <div style="display:flex;gap:8px">
        <select id="logFilterLevel" onchange="renderLogs()" class="btn btn-secondary" style="padding:8px 16px;font-size:13px">
          <option value="">全部级别</option>
          <option value="info">信息</option>
          <option value="warn">警告</option>
          <option value="error">错误</option>
        </select>
        <button class="btn btn-primary" onclick="fetchLogs()" style="padding:8px 16px;font-size:13px">刷新</button>
      </div>
    </div>
    <div class="content-section">
      <div class="card">
        <div id="logsList" class="log-list"></div>
      </div>
    </div>
  </div>

  <!-- ===== SETTINGS PAGE ===== -->
  <div class="page-content hidden" id="page-settings">
    <div class="page-header">
      <div><div class="page-title">设置</div><div class="page-subtitle">安全配置与连接守卫</div></div>
    </div>
    <div class="content-section">
      <div class="section-title">🔒 安全状态</div>
      <div class="card" style="padding:24px">
        <div id="securityInfo"></div>
      </div>
    </div>
  </div>

</main>

<!-- ========== LOGIN OVERLAY ========== -->
<div class="login-page" id="loginPage">
  <div class="login-box">
    <h1>🌸 NexusLink</h1>
    <p>Web 管理面板 · 安全认证</p>
    <input type="password" id="loginPassword" placeholder="请输入管理密码" onkeypress="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">登录</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<script>
// ==================== GLOBAL STATE ====================
let csrfToken = '';
let statusData = null;
let proxyData = [];
let logData = [];
let currentPage = 'dashboard';

// ==================== INIT ====================
document.addEventListener('DOMContentLoaded', () => {
  loadTheme();
  checkAuth();
});

// ==================== THEME ====================
function loadTheme() {
  const t = localStorage.getItem('nexuslink-theme') || 'light';
  document.documentElement.setAttribute('data-theme', t);
  updateThemeButton();
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('nexuslink-theme', next);
  updateThemeButton();
}
function updateThemeButton() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.querySelectorAll('.theme-toggle')[0].textContent = isDark ? '☀️' : '🌙';
}

// ==================== SIDEBAR ====================
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}
function switchPage(page, el) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.page-content').forEach(p => p.classList.add('hidden'));
  document.getElementById('page-' + page).classList.remove('hidden');
  // 移动端关闭侧边栏
  document.getElementById('sidebar').classList.remove('open');
  // 加载对应页面数据
  if (page === 'dashboard') refreshDashboard();
  else if (page === 'proxies') renderProxiesPage();
  else if (page === 'logs') fetchLogs();
  else if (page === 'settings') fetchSecurity();
}

// ==================== AUTH ====================
async function checkAuth() {
  try {
    const r = await fetch('/api/status', { credentials: 'same-origin' });
    if (r.ok) {
      document.getElementById('loginPage').classList.add('hidden');
      refreshDashboard();
    }
  } catch(e) {
    // 未登录，显示登录页
  }
}
async function doLogin() {
  const pw = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  try {
    const r = await fetch('/api/login', {
      method: 'POST', credentials: 'same-origin',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ password: pw })
    });
    const d = await r.json();
    if (d.success) {
      csrfToken = d.csrf_token;
      document.getElementById('loginPage').classList.add('hidden');
      refreshDashboard();
    } else {
      errEl.textContent = d.error || '密码错误';
    }
  } catch(e) {
    errEl.textContent = '网络错误，请稍后重试';
  }
}
async function handleLogout() {
  try {
    await fetch('/api/logout', { method: 'POST', credentials: 'same-origin', headers:{'X-CSRF-Token': csrfToken} });
    document.getElementById('loginPage').classList.remove('hidden');
    document.getElementById('loginPassword').value = '';
  } catch(e) {}
}

// ==================== API CALLS ====================
async function fetchStatus() {
  const r = await fetch('/api/status', { credentials: 'same-origin' });
  if (!r.ok) throw new Error('unauthorized');
  const d = await r.json();
  statusData = d.data || d;
  return statusData;
}
async function fetchProxies() {
  const r = await fetch('/api/proxies', { credentials: 'same-origin' });
  const d = await r.json();
  proxyData = d.data || d;
  return proxyData;
}
async function fetchLogs() {
  const r = await fetch('/api/logs', { credentials: 'same-origin' });
  const d = await r.json();
  logData = (d.data && d.data.logs) ? d.data.logs : [];
  renderLogs();
}
async function fetchSecurity() {
  const r = await fetch('/api/security', { credentials: 'same-origin' });
  const d = await r.json();
  renderSecurity(d.data || d);
}

// ==================== DASHBOARD ====================
async function refreshDashboard() {
  try {
    await Promise.all([fetchStatus(), fetchProxies()]);
    updateDashboardStats();
    updateDashboardServerInfo();
    updateDashboardProxyPreview();
  } catch(e) {
    if (e.message === 'unauthorized') {
      document.getElementById('loginPage').classList.remove('hidden');
    }
  }
}

function updateDashboardStats() {
  const s = statusData || {};
  document.getElementById('statClients').textContent = s.clientCount || 0;
  document.getElementById('statProxies').textContent = s.proxyCount || 0;
  document.getElementById('statVersion').textContent = s.version || 'v0.3.3';
  document.getElementById('statUptime').textContent = s.uptime || '--';
  document.getElementById('statStartTime').textContent = s.startTime || '--';
  document.getElementById('sidebarVersion').textContent = s.version || 'v0.3.3';
  
  document.getElementById('infoBindAddr').textContent = s.bindAddr || '--';
  document.getElementById('infoBindPort').textContent = s.bindPort || '--';
  document.getElementById('infoClients').textContent = s.clientCount || 0;
  document.getElementById('infoProxies').textContent = s.proxyCount || 0;
  document.getElementById('infoVersion').textContent = s.version || 'v0.3.3';
  document.getElementById('infoStartTime').textContent = s.startTime || '--';
  document.getElementById('infoUptime').textContent = s.uptime || '--';
}

function updateDashboardServerInfo() {
  // Already covered in updateDashboardStats
}

function updateDashboardProxyPreview() {
  const container = document.getElementById('dashboardProxyList');
  const badges = document.getElementById('proxyCountBadge');
  const proxies = proxyData || [];
  badges.textContent = proxies.length + ' 个';

  if (proxies.length === 0) {
    container.innerHTML = '<div class="empty-state"><p>暂无活跃代理</p></div>';
    return;
  }

  let html = '<table class="data-table"><thead><tr><th>名称</th><th>类型</th><th>远程端口</th><th>状态</th></tr></thead><tbody>';
  proxies.slice(0, 5).forEach(p => {
    html += `<tr>
      <td style="font-weight:500">${esc(p.name)}</td>
      <td><span class="badge badge-info">${esc(p.type)}</span></td>
      <td>${p.remotePort}</td>
      <td><span class="badge ${p.active ? 'badge-success' : 'badge-danger'}">${p.active ? '在线' : '离线'}</span></td>
    </tr>`;
  });
  html += '</tbody></table>';
  container.innerHTML = html;
}

// ==================== PROXIES PAGE ====================
function renderProxiesPage() {
  const container = document.getElementById('proxiesTableContainer');
  const proxies = proxyData || [];

  if (proxies.length === 0) {
    container.innerHTML = '<div class="empty-state"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".3"><rect x="2" y="2" width="20" height="8" rx="1"/><rect x="2" y="14" width="20" height="8" rx="1"/></svg><p>暂无代理配置</p></div>';
    return;
  }

  let html = '<table class="data-table"><thead><tr><th>名称</th><th>类型</th><th>远程端口</th><th>本地地址</th><th>本地端口</th><th>状态</th></tr></thead><tbody>';
  proxies.forEach(p => {
    html += `<tr>
      <td style="font-weight:500">${esc(p.name)}</td>
      <td><span class="badge badge-info">${esc(p.type)}</span></td>
      <td>${p.remotePort}</td>
      <td>${esc(p.localAddr || '--')}</td>
      <td>${p.localPort || '--'}</td>
      <td><span class="badge ${p.active ? 'badge-success' : 'badge-danger'}">${p.active ? '在线' : '离线'}</span></td>
    </tr>`;
  });
  html += '</tbody></table>';
  container.innerHTML = html;
}

// ==================== LOGS PAGE ====================
function renderLogs() {
  const container = document.getElementById('logsList');
  const filter = document.getElementById('logFilterLevel').value;
  let logs = logData;
  if (filter) logs = logs.filter(l => l.level === filter);

  if (logs.length === 0) {
    container.innerHTML = '<div class="empty-state"><p>暂无日志记录</p></div>';
    return;
  }

  let html = '';
  logs.forEach(log => {
    html += `<div class="log-item">
      <span class="log-time">${esc(log.time)}</span>
      <span class="log-level ${esc(log.level)}">${esc(log.level)}</span>
      <span>${esc(log.message)}</span>
    </div>`;
  });
  container.innerHTML = html;
}

// ==================== SETTINGS PAGE ====================
function renderSecurity(data) {
  const container = document.getElementById('securityInfo');
  const items = [
    { key: '登录保护', val: (data.rate_limit || '已启用') },
    { key: '会话超时', val: (data.session_timeout || '30分钟') },
    { key: '密码加密', val: 'SHA-256 + 盐值 (已启用)' },
    { key: 'CSRF 防护', val: (data.csrf_protection ? '已启用' : '未启用') },
    { key: 'HttpOnly Cookie', val: (data.httponly_cookie ? '已启用' : '未启用') },
    { key: '安全响应头', val: (data.security_headers ? '已启用' : '未启用') },
    { key: '时序攻击防护', val: (data.constant_time_compare ? '已启用' : '未启用') },
    { key: 'SameSite Cookie', val: (data.samesite_cookie ? '已启用' : '未启用') },
  ];
  let html = '<table class="data-table"><tbody>';
  items.forEach(item => {
    html += `<tr><td style="color:var(--text-secondary);font-weight:600;width:160px">${item.key}</td><td>${item.val}</td></tr>`;
  });
  html += '</tbody></table>';
  container.innerHTML = html;
}

// ==================== UTILS ====================
function esc(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ==================== AUTO REFRESH ====================
setInterval(() => {
  if (currentPage === 'dashboard' && !document.getElementById('loginPage').classList.contains('hidden')) return;
  if (currentPage === 'dashboard') refreshDashboard();
}, 10000); // 每10秒刷新
