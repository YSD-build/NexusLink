name: docker-publish

on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - '.github/workflows/docker-publish.yml'
      - 'cmd/**'
      - 'pkg/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU（多架构模拟）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像标签
        id: meta
        run: |
          TAGS="ghcr.io/ysd-build/nexuslink:latest"
          REF="${GITHUB_REF_NAME}"
          case "$REF" in
            v*) TAGS="${TAGS},ghcr.io/ysd-build/nexuslink:${REF#v}" ;;
          esac
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "镜像标签: ${TAGS}"

      - name: 构建并推送（amd64 / arm64 / armv7）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
